name: setup checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  setup-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Shellcheck
        run: shellcheck -x setup/apply-github-rules.sh setup/verify-github-rules.sh setup/common.sh setup/tests/test-fake-gh.sh

      - name: Validate ruleset JSON
        run: |
          jq empty setup/rulesets/protect-main.json setup/rulesets/protect-tags.json setup/rulesets/require-checks.json
          jq -e '
            .name == "protect-main"
            and .target == "branch"
            and .enforcement == "active"
            and .conditions.ref_name.include == ["~DEFAULT_BRANCH"]
            and .conditions.ref_name.exclude == []
            and .bypass_actors == [{
              "actor_id": 5,
              "actor_type": "RepositoryRole",
              "bypass_mode": "pull_request"
            }]
            and ([.rules[].type] | sort) == ["deletion", "non_fast_forward", "pull_request"]
            and any(.rules[];
              .type == "pull_request"
              and .parameters.required_approving_review_count == 1
              and .parameters.require_code_owner_review == true
              and .parameters.dismiss_stale_reviews_on_push == true
              and .parameters.require_last_push_approval == false
              and .parameters.required_review_thread_resolution == false
            )
          ' setup/rulesets/protect-main.json
          jq -e '
            .name == "protect-tags"
            and .target == "tag"
            and .enforcement == "active"
            and .conditions.ref_name.include == ["~ALL"]
            and .conditions.ref_name.exclude == []
            and .bypass_actors == [{
              "actor_id": 5,
              "actor_type": "RepositoryRole",
              "bypass_mode": "always"
            }]
            and ([.rules[].type] | sort) == ["creation", "deletion", "update"]
            and any(.rules[]; .type == "update" and .parameters.update_allows_fetch_and_merge == false)
          ' setup/rulesets/protect-tags.json
          jq -e '
            .name == "require-checks"
            and .target == "branch"
            and .enforcement == "active"
            and .bypass_actors == []
            and .conditions.ref_name.include == ["~DEFAULT_BRANCH"]
            and .conditions.ref_name.exclude == []
            and any(.rules[];
              .type == "required_status_checks"
              and .parameters.strict_required_status_checks_policy == true
              and .parameters.do_not_enforce_on_create == false
              and .parameters.required_status_checks == [{"context": "checks / gate"}]
            )
          ' setup/rulesets/require-checks.json

      - name: Actions are pinned to a commit SHA
        run: python3 setup/tests/check-action-pins.py

      - name: Fake gh tests
        run: bash setup/tests/test-fake-gh.sh
