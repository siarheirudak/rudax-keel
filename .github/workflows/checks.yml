name: checks

on:
  pull_request:
    # edited covers a base change, so a green gate from another base does not stay.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint
        run: bash scripts/check-actionlint.sh

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: shellcheck
        run: bash scripts/check-shellcheck.sh

  json:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: json
        run: bash scripts/check-json.sh

  md-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Markdown links
        run: |
          python3 scripts/check-md-links.py
          python3 scripts/tests/test_md_links.py

  action-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Action pins
        run: python3 setup/tests/check-action-pins.py

  fake-gh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fake gh tests
        run: bash setup/tests/test-fake-gh.sh
      - name: Scope rule
        run: python3 scripts/check-scope.py --self-test
      - name: Require-checks reminder
        run: python3 scripts/warn-require-checks.py --self-test
      - name: Gate job list
        run: python3 scripts/tests/test_gate_jobs.py

  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Project checks
        # Commands live in project_checks() in scripts/check.sh.
        run: bash scripts/check.sh --project-only

  harness:
    runs-on: ubuntu-24.04
    # The full mutant set runs longer than 40 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: bash setup/gitleaks-install.sh
      - name: Build keel-git
        run: docker build -t keel-git -f setup/docker/keel-git.Dockerfile setup/docker
      - name: Run the harness
        # The runner sets GITHUB_* names. keel-doctor treats any GH_* or GITHUB_* name as a token,
        # so the base ref is passed as KEEL_MUTATE_BASE and those names are not forwarded.
        run: |
          set -eu
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            mutate_base="origin/${GITHUB_BASE_REF}"
          else
            mutate_base="origin/main"
          fi
          git rev-parse --verify "${mutate_base}^{commit}" >/dev/null
          clean=(
            "HOME=$HOME"
            "PATH=$PATH"
            "USER=${USER:-runner}"
            "LOGNAME=${LOGNAME:-${USER:-runner}}"
            "SHELL=${SHELL:-/bin/bash}"
            "LANG=${LANG:-C.UTF-8}"
            "TMPDIR=${TMPDIR:-/tmp}"
            "KEEL_MUTATE_BASE=${mutate_base}"
            "KEEL_CI=1"
          )
          if [ -n "${DOCKER_HOST:-}" ]; then
            clean+=("DOCKER_HOST=$DOCKER_HOST")
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            clean+=("KEEL_MUTATE_DEFER=1")
          fi
          exec env -i "${clean[@]}" bash setup/tests/harness/run-tests.sh

  keel-gate:
    name: keel-gate
    needs: [actionlint, shellcheck, json, md-links, action-pins, fake-gh, project, harness]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate
        env:
          R_ACTIONLINT: ${{ needs.actionlint.result }}
          R_SHELLCHECK: ${{ needs.shellcheck.result }}
          R_JSON: ${{ needs.json.result }}
          R_MD_LINKS: ${{ needs.md-links.result }}
          R_ACTION_PINS: ${{ needs.action-pins.result }}
          R_FAKE_GH: ${{ needs.fake-gh.result }}
          R_PROJECT: ${{ needs.project.result }}
          R_HARNESS: ${{ needs.harness.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          KEEL_MUTATE_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GATE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # B16 (D-156, D-352): the pull request must not grade itself. Only the verdict
        # chain runs from the base commit: check-gate.sh, gate-jobs.txt, mutant-result.py
        # and what it loads. The jobs above still test the pull request's own code.
        # A push to main is graded by the pushed commit, which is main itself.
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$GATE_PR_BASE_SHA ;;
            push) base=$GITHUB_SHA ;;
            *)
              printf 'how to fix: keel-gate runs only on pull_request and push, not %s\n' "$GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if ! [[ $base =~ ^[0-9a-f]{40}$ ]]; then
            printf 'how to fix: the base commit is missing or not a full SHA: %s\n' "$base" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            printf 'how to fix: base commit %s is not in the checkout; keep fetch-depth: 0\n' "$base" >&2
            exit 1
          fi
          # The whole harness directory comes from base, so a refactor or a new import
          # there needs no change here. The PR's own copies of these files are not run.
          # Only the three files this step and check-gate.sh call by name must exist.
          chain=(scripts/check-gate.sh scripts/gate-jobs.txt setup/tests/harness)
          entry=(
            scripts/check-gate.sh
            scripts/gate-jobs.txt
            setup/tests/harness/mutant-result.py
          )
          trusted="$RUNNER_TEMP/keel-gate-base"
          rm -rf "$trusted"
          mkdir -p "$trusted"
          git archive --format=tar "$base" -- "${chain[@]}" | tar -x -C "$trusted"
          for file in "${entry[@]}"; do
            if [[ ! -f "$trusted/$file" ]]; then
              printf 'how to fix: %s is missing at base %s\n' "$file" "$base" >&2
              exit 1
            fi
          done
          printf 'verdict chain from %s\n' "$base"
          # mutate-plan.sh diffs the pull request checkout, not the extracted copy.
          export KEEL_MUTATE_REPO="$GITHUB_WORKSPACE"
          bash "$trusted/scripts/check-gate.sh"

  # Not an input to keel-gate. A permissions failure is a notice, and the
  # step cannot fail this job or the gate.
  require-checks-reminder:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Remind the owner when require-checks is missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/warn-require-checks.py || true
